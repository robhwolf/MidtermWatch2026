name: Refresh results

on:
  schedule:
    # All crons are UTC. Clocks fall back on 1 Nov, so ET is UTC-5 for all of these.
    # GitHub can run these 5 to 10 minutes late, and can skip runs under load.

    # Temporary test of the scheduler, tonight only. Remove after confirming.
    - cron: '12,27,42,57 2-3 1 11 *'

    # Before Election Day: 8am and 8pm ET.
    - cron: '0 13 1-3 11 *'
    - cron: '0 1 1-3 11 *'
    # A last run just before the first polls close.
    - cron: '45 22 3 11 *'

    # Election night: every 5 minutes, 6pm ET Tuesday to 10am ET Wednesday.
    # Offset from :00 because the top of the hour is GitHub's busiest moment.
    - cron: '2-59/5 23 3 11 *'
    - cron: '2-59/5 0-14 4 11 *'

    # Then hourly until the day after Louisiana's 12 December runoffs.
    - cron: '7 15-23 4 11 *'
    - cron: '7 * 5-30 11 *'
    - cron: '7 * 1-13 12 *'

  push:
    branches: [main]
    paths:
      - 'data/source/**'
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/**'

  # Run by hand from the Actions tab if a scheduled run looks stuck.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the source files
        run: node --test test/*.test.mjs

      - name: Fetch results
        run: node scripts/fetch-results.mjs

      - name: Commit results
        run: |
          git config user.name "midterm-watch-bot"
          git config user.email "actions@github.com"
          git add site/data/results.json site/data/markets.json
          git diff --staged --quiet && exit 0
          git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep 5
          done
          echo "::warning::Could not push results; the site still deploys from this run"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
