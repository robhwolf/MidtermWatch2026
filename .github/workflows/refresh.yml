name: Refresh results

on:
  schedule:
    # All crons are UTC. Clocks fall back on 1 Nov, so ET is UTC-5 for all of these.
    # GitHub can run these 5 to 10 minutes late, and can skip runs under load.
    # None fired in this repo's first hours, so the next job below keeps the
    # schedule itself. These stay to restart the chain if it ever breaks.

    # Before Election Day: 8am and 8pm ET.
    - cron: '0 13 1-3 11 *'
    - cron: '0 1 1-3 11 *'
    # A last run just before the first polls close.
    - cron: '45 22 3 11 *'

    # Election night: every 5 minutes, 6pm ET Tuesday to 10am ET Wednesday.
    # Offset from :00 because the top of the hour is GitHub's busiest moment.
    - cron: '2-59/5 23 3 11 *'
    - cron: '2-59/5 0-14 4 11 *'

    # Then hourly until the day after Louisiana's 12 December runoffs.
    - cron: '7 15-23 4 11 *'
    - cron: '7 * 5-30 11 *'
    - cron: '7 * 1-13 12 *'

  push:
    branches: [main]
    paths:
      - 'data/source/**'
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/**'

  # Run by hand from the Actions tab if a scheduled run looks stuck.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency:
      group: refresh
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # main, not the commit that triggered the run: a queued run must start from
      # the data the run before it committed.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check the source files
        run: node --test test/*.test.mjs

      - name: Fetch results
        run: node scripts/fetch-results.mjs

      - name: Commit results
        run: |
          git config user.name "midterm-watch-bot"
          git config user.email "actions@github.com"
          # These files are generated, so this run's copy simply replaces main's.
          # Merging them could leave conflict markers in what gets published.
          cp site/data/results.json site/data/markets.json "$RUNNER_TEMP/"
          for attempt in 1 2 3; do
            if git fetch origin main && git reset --hard origin/main; then
              cp "$RUNNER_TEMP/results.json" "$RUNNER_TEMP/markets.json" site/data/
              git add site/data/results.json site/data/markets.json
              git diff --staged --quiet && exit 0
              git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
              git push origin main && exit 0
            fi
            sleep 5
          done
          echo "::warning::Could not push results; the site still deploys from this run"

      # A bad file stops here, and the last good version stays online.
      - name: Check the data files
        run: node -e "for (const f of ['results', 'markets']) JSON.parse(require('fs').readFileSync('site/data/' + f + '.json', 'utf8'))"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

  # Waits for the next slot, then starts the next run, even if this one failed.
  next:
    needs: refresh
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          wait=$(node scripts/next-run.mjs)
          [ -n "$wait" ] || exit 0
          sleep "$wait"
          # Only one chain: a newer chained run carries on instead, and a run from a
          # push or the cron starts the next only if no chained run is going.
          floor=$GITHUB_RUN_ID
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || floor=0
          newer=$(gh run list --workflow refresh.yml --event workflow_dispatch --limit 20 --json databaseId,status \
            --jq "[.[] | select(.status != \"completed\" and .databaseId > $floor)] | length") || newer=0
          [ "$newer" = 0 ] || exit 0
          for attempt in 1 2 3 4; do
            gh workflow run refresh.yml --ref main && exit 0
            sleep 15
          done
          exit 1
